# 推送 v* 标签（如 v1.0.0）时：跑全部测试 → 构建 devicedock-plugin.zip 与 .sha256 → 发 GitHub Release。
# runner 与 action 版本与宿主仓库的模板一致（node24 运行时的稳定版本）。
name: Release DeviceDock Plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'

      - name: Run tests
        run: npm test

      - name: Build plugin archive and sha256
        run: node tools/build.mjs --out-dir dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/devicedock-plugin.zip \
            dist/devicedock-plugin.zip.sha256 \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
